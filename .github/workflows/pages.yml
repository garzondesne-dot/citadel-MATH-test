name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          VITE_CHANNEL: beta # 📲 베타 이름 · 아이콘 · id (정식 = release)
      - run: VITE_SCHOOL=srzmf npx vite build --outDir dist/s/srzmf --emptyOutDir # 🏫 학교판(무안행복중) = 같은 코드 · 빈 과목 팩 · 그 학교 서버 (베타에서 먼저)
      - run: node tools/school/moved.mjs dist # 🏫 정식으로 옮긴 학교판 = 넘김 페이지 (tools/school/moved.json 에서 true 일 때만 · 정식 「배포」 뒤)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
